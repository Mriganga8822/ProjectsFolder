
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1b">
<title>Projects Links | Mriganga</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080d1b;--text:#f4f6ff;--muted:#a5b4d6}
html{scroll-behavior:smooth}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,Arial,sans-serif;overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
  radial-gradient(ellipse at 10% 0%,#25266a70,transparent 40%),
  radial-gradient(ellipse at 90% 70%,#102c5c55,transparent 40%);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:.22;
  background-image:radial-gradient(#8ca5ff 1px,transparent 1px);
  background-size:45px 45px;
}
nav,main,footer{position:relative;z-index:1}
nav{
  height:76px;padding:0 6%;display:flex;align-items:center;
  justify-content:space-between;
}
.logo{font-size:27px;font-weight:900;color:#829cff}
.menu{font-size:25px;color:#829cff}
main{width:min(1100px,90%);margin:auto}
.hero{text-align:center;padding:42px 0 35px;animation:appear .9s ease both}
.eyebrow{color:#8fa5ff;letter-spacing:3px;font-size:12px;font-weight:700}
h1{font-size:clamp(38px,7vw,68px);line-height:1.15;margin:15px 0}
.gradient{
  background:linear-gradient(90deg,#19e1e7,#777aff,#df7dff);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.subtitle{font-size:clamp(17px,4vw,25px);color:#a6b7ff;font-style:italic}
.note{color:#a6b7ff;margin-top:10px;font-size:17px}
.spark{display:inline-block;color:#91a7ff;animation:twinkle 2s infinite}
.section-label{margin:0 0 18px;color:#8298c5;font-size:13px;letter-spacing:2px}
.projects{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;
  padding:15px 0;
}
.project{
  --accent:#398cff;position:relative;display:flex;align-items:center;
  gap:16px;min-width:0;padding:23px 18px;
  border:1px solid var(--accent);border-radius:19px;
  background:linear-gradient(135deg,#15203aee,#10182cdd);
  text-decoration:none;color:white;overflow:hidden;isolation:isolate;
  transition:transform .3s,border-color .3s,box-shadow .3s;
  animation:rise .7s both;
}
.project:nth-child(2){animation-delay:.08s}
.project:nth-child(3){animation-delay:.16s}
.project:nth-child(4){animation-delay:.24s}
.project:nth-child(5){animation-delay:.32s}
.project:nth-child(6){animation-delay:.4s}
.project:before{
  content:"";position:absolute;width:100px;height:100px;border-radius:50%;
  background:var(--accent);filter:blur(45px);opacity:.18;right:-30px;top:-30px;
  transition:opacity .3s;z-index:-1;
}
.project:hover{
  transform:translateY(-7px);
  box-shadow:0 12px 35px #0005,0 0 18px #398cff20;
}
.project:hover:before{opacity:.5}
.project:focus-visible,.close-modal:focus-visible,.ok-button:focus-visible{
  outline:2px solid #67e8ff;outline-offset:4px;
}
.icon{
  flex-shrink:0;width:62px;height:62px;border-radius:16px;
  background:var(--accent);display:grid;place-items:center;
  font-size:29px;box-shadow:0 5px 25px #0003;
  transition:transform .35s;
}
.project:hover .icon{transform:rotate(-7deg) scale(1.08)}
.info{flex:1;min-width:0;position:relative}
.info h2{font-size:17px;line-height:1.4;margin-bottom:8px;overflow-wrap:anywhere}
.info p{font-size:13px;color:var(--muted);line-height:1.7}
.arrow{font-size:22px;color:white;flex-shrink:0;transition:transform .3s}
.project:hover .arrow{transform:translateX(5px)}
.footer-note{text-align:center;padding:38px 0 100px;color:#899edb;font-style:italic}
footer{
  position:fixed;right:20px;bottom:15px;z-index:5;
  padding:8px 13px;border-radius:30px;
  background:#080d1bdd;backdrop-filter:blur(8px);
  color:#a8b9ed;font-size:13px;
}
footer span{color:#67e8ff;font-weight:700}

/* FLOATING TRANSPARENT BUBBLES */
#bubbleLayer{
  position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;
}
.bubble{
  position:absolute;bottom:-100px;left:var(--left);
  width:var(--size);height:var(--size);
  border:1px solid rgba(177,205,255,.35);
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,
    rgba(255,255,255,.35),rgba(106,151,255,.06) 35%,
    rgba(155,116,255,.025) 70%,transparent);
  box-shadow:inset -5px -7px 18px rgba(95,131,255,.08),
    0 0 12px rgba(112,153,255,.05);
  animation:floatBubble var(--duration) linear var(--delay) infinite;
  opacity:0;
}
.bubble:after{
  content:"";position:absolute;top:20%;left:23%;
  width:18%;height:10%;border-radius:50%;
  background:rgba(255,255,255,.5);filter:blur(1px);
  transform:rotate(-35deg);
}
@keyframes floatBubble{
  0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  10%{opacity:.65}
  50%{transform:translate3d(35px,-50vh,0) rotate(100deg)}
  90%{opacity:.45}
  100%{transform:translate3d(-25px,-115vh,0) rotate(200deg);opacity:0}
}
@keyframes rise{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes twinkle{
  0%,100%{opacity:.4;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.2)}
}

/* UNDER CONSTRUCTION POPUP */
.modal[hidden]{display:none}
.modal{
  position:fixed;inset:0;z-index:1000;
  display:grid;place-items:center;padding:20px;
  background:rgba(2,6,23,.78);backdrop-filter:blur(9px);
  animation:appear .2s ease;
}
.modal-box{
  position:relative;width:min(100%,370px);padding:32px 23px;
  text-align:center;background:rgba(18,26,45,.96);
  border:1px solid #fbbf24;border-radius:22px;
  box-shadow:0 0 45px #f59e0b20;
  animation:rise .3s ease;
}
.construction-icon{font-size:49px;margin-bottom:12px;
  animation:twinkle 1.8s infinite}
.modal-box h2{color:#fbbf24;font-size:25px;margin-bottom:12px}
.modal-box p{color:#cbd5e1;line-height:1.7;font-size:14px}
.modal-box .coming-soon{margin-top:10px;color:#a5b4fc}
.close-modal{
  position:absolute;right:13px;top:7px;
  background:none;border:0;color:white;font-size:29px;cursor:pointer;
}
.ok-button{
  margin-top:22px;padding:11px 27px;background:#fbbf24;
  color:#111827;border:0;border-radius:9px;font-weight:bold;
  font-size:14px;cursor:pointer;transition:transform .2s;
}
.ok-button:hover{transform:scale(1.05)}
body.modal-open{overflow:hidden}

@media(max-width:850px){
  .projects{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  nav{height:62px;padding:0 5%}
  main{width:91%}
  .hero{padding-top:40px}
  .projects{grid-template-columns:1fr;gap:14px}
  .project{padding:18px 15px}
  .icon{width:55px;height:55px}
  .footer-note{padding-bottom:95px}
  footer{right:10px;bottom:10px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;transition:none!important;
    scroll-behavior:auto!important;
  }
  .bubble{display:none}
}
</style>
</head>

<body>
<!-- Animated background bubbles -->
<div id="bubbleLayer" aria-hidden="true"></div>

<nav>
  <div class="logo">&lt;/&gt;</div>
  <div class="menu" aria-hidden="true">☰</div>
</nav>

<main>
  <header class="hero">
    <div class="eyebrow">
      <span class="spark">✦</span> MY DIGITAL SPACE
      <span class="spark">✦</span>
    </div>
    <h1>Projects <span class="gradient">Links</span></h1>
    <div class="subtitle">(some projects are not available now)</div>
    <p class="note">[ Specially used <span class="gradient">AI</span> for creating]</p>
  </header>

  <p class="section-label">✦ &nbsp; EXPLORE MY PROJECTS</p>
  <section class="projects" id="projects" aria-label="My projects"></section>

  <div class="footer-note">
    <span class="spark">✧</span>
    &nbsp; More projects coming soon... &nbsp;
    <span class="spark">✧</span>
  </div>
</main>

<footer>handled by <span>Mriganga</span> ✌🏻</footer>

<!-- Popup for projects that are not published -->
<div id="constructionModal" class="modal" hidden
     role="dialog" aria-modal="true"
     aria-labelledby="modalTitle" aria-describedby="modalMessage">
  <div class="modal-box">
    <button class="close-modal" aria-label="Close popup">&times;</button>
    <div class="construction-icon" aria-hidden="true">🚧</div>
    <h2 id="modalTitle">Under Construction!</h2>
    <p id="modalMessage">
      Available soon 
    </p>
    <p class="coming-soon">✨ Yeeeeaahhh Laudeyaaaa...</p>
    <button class="ok-button">Got it!</button>
  </div>
</div>

<script>
/* =====================================
   EDIT YOUR PROJECTS HERE
   published: true  = opens the URL
   published: false = shows the popup
   ===================================== */

const projects = [
  {
    title: "Weather Website",
    description: "Check live weather updates(available)",
    url: "https://mriganga8822.github.io/atmos-weather-dashboard/",
    icon: "📂",
    color: "#398cff",
    published: true
  },
  {
    title: "AI Project",
    description: "These projects reply speed is slow because of free api's",
    url: "https://mriganga8822.github.io/gemini-ai-chatbox./",
    icon: "📂",
    color: "#a442ff",
    published: true
  },
  {
    title: "My Portfolio",
    description: "Explore my work and skills",
    url: "",
    icon: "📁",
    color: "#00c995",
    published: false
  },
  {
    title: "Web App",
    description: "A useful web application",
    url: "",
    icon: "📁",
    color: "#ffae32",
    published: false
  },
  {
    title: "Game Projects",
    description: "gaming projects",
    url: "",
    icon: "📁",
    color: "#ff426f",
    published: false
  },
  {
    title: "My GitHub",
    description: "More projects and code(available)",
    url: "https://github.com/mriganga8822",
    icon: "📂",
    color: "#00cce5",
    published: true
  }
];

/* CREATE FLOATING TRANSPARENT BUBBLES */
const bubbleLayer = document.getElementById("bubbleLayer");
const reduceMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

if (!reduceMotion) {
  for (let i = 0; i < 18; i++) {
    const bubble = document.createElement("span");
    bubble.className = "bubble";
    bubble.style.setProperty("--left", `${Math.random() * 100}%`);
    bubble.style.setProperty("--size", `${12 + Math.random() * 55}px`);
    bubble.style.setProperty("--duration", `${12 + Math.random() * 18}s`);
    bubble.style.setProperty("--delay", `${-Math.random() * 25}s`);
    bubbleLayer.appendChild(bubble);
  }
}

/* CREATE PROJECT CARDS */
const container = document.getElementById("projects");
const modal = document.getElementById("constructionModal");
const closeButton = modal.querySelector(".close-modal");
const okButton = modal.querySelector(".ok-button");
let previousFocus = null;

function openConstructionModal() {
  previousFocus = document.activeElement;
  modal.hidden = false;
  document.body.classList.add("modal-open");
  okButton.focus();
}

function closeConstructionModal() {
  modal.hidden = true;
  document.body.classList.remove("modal-open");

  if (previousFocus && typeof previousFocus.focus === "function") {
    previousFocus.focus();
  }
}

projects.forEach((project, index) => {
  const link = document.createElement("a");
  link.className = "project";
  link.style.setProperty("--accent", project.color);
  link.style.animationDelay = `${Math.min(index * 0.08, 0.5)}`;
  link.setAttribute("aria-label", `Open ${project.title}`);

  const isPublished =
    project.published === true &&
    typeof project.url === "string" &&
    /^https?:\/\//i.test(project.url) &&
    !project.url.includes("example.com");

  if (isPublished) {
    link.href = project.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
  } else {
    link.href = "#";
    link.setAttribute("aria-haspopup", "dialog");
    link.addEventListener("click", function(event) {
      event.preventDefault();
      openConstructionModal();
    });
  }

  const icon = document.createElement("div");
  icon.className = "icon";
  icon.textContent = project.icon;
  icon.setAttribute("aria-hidden", "true");

  const info = document.createElement("div");
  info.className = "info";

  const title = document.createElement("h2");
  title.textContent = project.title;

  const description = document.createElement("p");
  description.textContent = isPublished
    ? project.description
    : `${project.description} · Coming soon`;

  const arrow = document.createElement("span");
  arrow.className = "arrow";
  arrow.textContent = isPublished ? "→" : "⋯";
  arrow.setAttribute("aria-hidden", "true");

  info.append(title, description);
  link.append(icon, info, arrow);
  container.appendChild(link);
});

/* CLOSE POPUP */
closeButton.addEventListener("click", closeConstructionModal);
okButton.addEventListener("click", closeConstructionModal);

modal.addEventListener("click", function(event) {
  if (event.target === modal) closeConstructionModal();
});

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape" && !modal.hidden) {
    closeConstructionModal();
  }
});
</script>
</body>
</html>
